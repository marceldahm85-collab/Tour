name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-release-apk.yml"
      - "index.html"
      - "app-start-editor.js"
      - "dashboard-premium-alpine.js"
      - "stats-premium-alpine.js"
      - "stats-peak-photo-gallery.js"
      - "stats-peak-photo-gallery.css"
      - "premium-alpine-photo-motifs.css"
      - "premium-depth-effects.css"

permissions:
  contents: read
  actions: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main source
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Validate and restore protected release signing key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64" || { echo "::error::Missing secret ANDROID_RELEASE_KEYSTORE_BASE64."; exit 1; }
          test -n "$ANDROID_RELEASE_STORE_PASSWORD" || { echo "::error::Missing secret ANDROID_RELEASE_STORE_PASSWORD."; exit 1; }
          test -n "$ANDROID_RELEASE_KEY_ALIAS" || { echo "::error::Missing secret ANDROID_RELEASE_KEY_ALIAS."; exit 1; }

          KEYSTORE_PATH="$GITHUB_WORKSPACE/android/app/release-signing/bergtouren-release.p12"
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          printf "%s" "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          keytool -list -keystore "$KEYSTORE_PATH" -storetype PKCS12 -storepass "$ANDROID_RELEASE_STORE_PASSWORD" -alias "$ANDROID_RELEASE_KEY_ALIAS"

          {
            echo "ANDROID_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_RELEASE_STORE_PASSWORD=$ANDROID_RELEASE_STORE_PASSWORD"
            echo "ANDROID_RELEASE_KEY_ALIAS=$ANDROID_RELEASE_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Verify toolchain and source syntax
        run: |
          set -euo pipefail
          java --version
          ./android/gradlew --version
          if grep -Eq '<View([[:space:]>])' android/app/src/main/res/layout/widget_year_stats.xml; then
            echo "::error::RemoteViews does not support plain android.view.View elements in widget layouts."
            exit 1
          fi
          node --check app-main-20261019.js
          node --check pdf-magazine.js
          node --check android-backup-bridge.js
          node --check android-gallery-photos.js
          node --check stats-peak-photo-gallery.js
          node --check background-image-manager.js
          node --check theme-editor-unified.js
          node --check theme-editor-workflow.js
          node --check app-start-editor.js

      - name: Assemble signed release APK
        run: ./android/gradlew --no-daemon --stacktrace -p android :app:assembleRelease

      - name: Verify release package and APK signature
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='at.marcel.bergtouren'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

          cp "$APK" android/app/build/outputs/apk/release/bergtouren-release.apk
          sha256sum android/app/build/outputs/apk/release/bergtouren-release.apk

      - name: Remove temporary private key from runner
        if: always()
        run: rm -f android/app/release-signing/bergtouren-release.p12

      - name: Upload signed APK for installation
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: android/app/build/outputs/apk/release/bergtouren-release.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Add release details to run summary
        run: |
          {
            echo "## Bergtouren Android — Release APK"
            echo
            echo "- Package: at.marcel.bergtouren"
            echo "- Version: 0.7.5 (20)"
            echo "- Build type: signed, non-debuggable Release"
            echo "- Artifact: bergtouren-release.apk"
            echo
            echo "SHA-256:"
            sha256sum android/app/build/outputs/apk/release/bergtouren-release.apk
            echo
            echo "The APK artifact is retained for 14 days."
          } >> "$GITHUB_STEP_SUMMARY"
