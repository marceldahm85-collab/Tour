name: Android APK (Debug)

on:
  push:
    branches:
      - feature/android-gallery-shell
    paths:
      - "android/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Verify toolchain
        run: |
          java --version
          ./android/gradlew --version

      - name: Assemble debug APK
        run: ./android/gradlew --no-daemon --stacktrace -p android :app:assembleDebug

      - name: Prepare clearly named APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/bergtouren-debug.apk

      - name: Calculate APK checksum
        run: sha256sum android/app/build/outputs/apk/debug/bergtouren-debug.apk

      - name: Upload APK for direct download on the phone
        id: upload
        uses: actions/upload-artifact@v7
        with:
          # archive:false uploads the single APK as a raw file.
          # upload-artifact v7 ignores "name" in this mode, so the filename
          # itself determines the artifact label shown in GitHub Actions.
          path: android/app/build/outputs/apk/debug/bergtouren-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Add download details to run summary
        env:
          APK_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "## Bergtouren Android – Debug APK"
            echo
            echo "The APK is attached as the directly downloadable artifact **bergtouren-debug.apk**."
            echo
            echo "SHA-256:"
            sha256sum android/app/build/outputs/apk/debug/bergtouren-debug.apk
            echo
            echo "The artifact is retained for 14 days."
          } >> "$GITHUB_STEP_SUMMARY"
