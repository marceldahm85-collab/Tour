name: Android APK (Debug)

on:
  # This branch is the signing-compatible Android build lane. The source that
  # gets packaged is always checked out from main (see checkout step below).
  push:
    branches:
      - feature/android-gallery-shell
    paths:
      - "android/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK from main
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main source
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      # Keep using the signing key that was used for the already distributed
      # gallery-test APKs on this branch. Do not generate a replacement key.
      - name: Restore existing gallery-test signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bergtouren-gallery-debug-signing-v1

      - name: Verify existing signing key
        run: |
          test -f "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Verify toolchain
        run: |
          java --version
          ./android/gradlew --version

      - name: Check gallery integration JavaScript syntax
        run: node --check android-gallery-photos.js

      - name: Assemble debug APK
        run: ./android/gradlew --no-daemon --stacktrace -p android :app:assembleDebug

      - name: Prepare clearly named APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/bergtouren-gallerytest.apk

      - name: Calculate APK checksum
        run: sha256sum android/app/build/outputs/apk/debug/bergtouren-gallerytest.apk

      - name: Upload APK for direct download on the phone
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: android/app/build/outputs/apk/debug/bergtouren-gallerytest.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      # One-time bridge: transfer the existing branch-scoped signing key into
      # the default-branch cache, then delete this short-lived artifact there.
      - name: Prepare one-time signing-key handoff
        run: cp "$HOME/.android/debug.keystore" "$RUNNER_TEMP/bergtouren-gallery-signing-key.keystore"

      - name: Upload short-lived signing-key handoff
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/bergtouren-gallery-signing-key.keystore
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Add download details to run summary
        env:
          APK_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "## Bergtouren Android – Galerie-Test APK"
            echo
            echo "The APK is built from the current main branch and signed with the established gallery-test key."
            echo
            echo "The APK artifact is **bergtouren-gallerytest.apk**."
            echo
            echo "SHA-256:"
            sha256sum android/app/build/outputs/apk/debug/bergtouren-gallerytest.apk
            echo
            echo "The APK is retained for 14 days. The one-time key handoff expires after 1 day and is removed after migration."
          } >> "$GITHUB_STEP_SUMMARY"
