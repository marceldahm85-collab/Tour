name: Android APK (Debug)

on:
  push:
    branches:
      - feature/android-gallery-shell
      - feature/android-unified-media-gallery
    paths:
      - "android/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      # Keep one stable test signing key across cloud builds on this branch.
      # The gallery test app uses a separate application ID, so the currently
      # installed shell app is not overwritten or forced to be uninstalled.
      - name: Restore gallery test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bergtouren-gallery-debug-signing-v1

      - name: Ensure gallery test signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Verify toolchain
        run: |
          java --version
          ./android/gradlew --version

      - name: Check gallery integration JavaScript syntax
        run: node --check android-gallery-photos.js

      - name: Assemble debug APK
        run: ./android/gradlew --no-daemon --stacktrace -p android :app:assembleDebug

      - name: Prepare clearly named APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/bergtouren-gallerytest.apk

      - name: Calculate APK checksum
        run: sha256sum android/app/build/outputs/apk/debug/bergtouren-gallerytest.apk

      - name: Upload APK for direct download on the phone
        id: upload
        uses: actions/upload-artifact@v7
        with:
          # archive:false uploads the single APK as a raw file.
          # upload-artifact v7 ignores "name" in this mode, so the filename
          # itself determines the artifact label shown in GitHub Actions.
          path: android/app/build/outputs/apk/debug/bergtouren-gallerytest.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Add download details to run summary
        env:
          APK_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "## Bergtouren Android – Galerie-Test APK"
            echo
            echo "The APK is attached as the directly downloadable artifact **bergtouren-gallerytest.apk**."
            echo
            echo "SHA-256:"
            sha256sum android/app/build/outputs/apk/debug/bergtouren-gallerytest.apk
            echo
            echo "The artifact is retained for 14 days."
          } >> "$GITHUB_STEP_SUMMARY"
