name: Android APK (Debug)

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "android-gallery-photos.js"
      - "android-gallery-photos.css"
      - "background-image-manager.js"
      - "theme-editor-unified.js"
      - "index.html"
      - "styles-overrides.css"
      - "sw.js"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:
  # Keep the default-branch signing cache active. GitHub expires unused
  # Actions caches, so this tiny daily job prevents an unexpected key change.
  schedule:
    - cron: "31 4 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keep-signing-cache-alive:
    if: github.event_name == 'schedule'
    name: Keep Android signing key available
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore established gallery-test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bergtouren-gallery-debug-signing-v1

      - name: Verify cached signing key
        run: |
          test -f "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

  build:
    if: github.event_name != 'schedule'
    name: Build debug APK from main
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main source
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      # The one-time handoff imports the existing signing key from the last
      # compatible branch build. All later main builds use this default-branch
      # cache. Never silently generate a new signing key.
      - name: Restore established gallery-test signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bergtouren-gallery-debug-signing-v1

      - name: Import existing signing key on first main build
        if: steps.signing-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_SOURCE_RUN_ID: "41108642560"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$RUNNER_TEMP/signing-key"
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIGNING_SOURCE_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "bergtouren-gallery-signing-key.keystore") | .id' | head -n 1)"
          test -n "$artifact_id"
          # upload-artifact v7 archive:false stores this one-file artifact raw.
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            --output "$RUNNER_TEMP/signing-key/bergtouren-gallery-signing-key.keystore"
          cp "$RUNNER_TEMP/signing-key/bergtouren-gallery-signing-key.keystore" "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Verify existing signing key
        run: |
          test -f "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Verify toolchain
        run: |
          java --version
          ./android/gradlew --version

      - name: Check Android and editor JavaScript syntax
        run: |
          node --check android-gallery-photos.js
          node --check background-image-manager.js
          node --check theme-editor-unified.js

      - name: Assemble debug APK
        run: ./android/gradlew --no-daemon --stacktrace -p android :app:assembleDebug

      - name: Prepare clearly named APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/bergtouren-gallerytest.apk

      - name: Calculate APK checksum
        run: sha256sum android/app/build/outputs/apk/debug/bergtouren-gallerytest.apk

      - name: Upload APK for direct download on the phone
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: android/app/build/outputs/apk/debug/bergtouren-gallerytest.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Remove one-time signing-key handoff artifact
        if: steps.signing-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_SOURCE_RUN_ID: "41108642560"
        run: |
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIGNING_SOURCE_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "bergtouren-gallery-signing-key.keystore") | .id' | head -n 1)"
          if [ -n "$artifact_id" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          fi

      - name: Add download details to run summary
        env:
          APK_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "## Bergtouren Android – Galerie-Test APK"
            echo
            echo "Built from the current main branch and signed with the established gallery-test key."
            echo
            echo "APK artifact: **bergtouren-gallerytest.apk**"
            echo
            echo "SHA-256:"
            sha256sum android/app/build/outputs/apk/debug/bergtouren-gallerytest.apk
            echo
            echo "The APK artifact is retained for 14 days."
          } >> "$GITHUB_STEP_SUMMARY"
