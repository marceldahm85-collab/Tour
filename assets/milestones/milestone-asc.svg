<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
<defs>
  <clipPath id="badge-clip"><circle cx="48" cy="48" r="47.5"/></clipPath>
  <filter id="motif-sharpen" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
    <feConvolveMatrix order="3" kernelMatrix="0 -0.18 0 -0.18 1.72 -0.18 0 -0.18 0" edgeMode="duplicate" preserveAlpha="true"/>
  </filter>
  <filter id="badge-frame-glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="1.1"/>
  </filter>
</defs>
<g clip-path="url(#badge-clip)">
  <image filter="url(#motif-sharpen)" href="data:image/jpeg;base64," x="-7.68" y="-7.68" width="111.36" height="111.36" preserveAspectRatio="xMidYMid slice"/>
</g>
<!-- Identischer, eigenständiger Rahmen für alle fünf Motive -->
<circle cx="48" cy="48" r="46.25" fill="none" stroke="#45ba91" stroke-width="3" opacity=".34" filter="url(#badge-frame-glow)"/>
<circle cx="48" cy="48" r="47.0" fill="none" stroke="#143b31" stroke-width="1.6"/>
<circle cx="48" cy="48" r="46.15" fill="none" stroke="#b7f3d7" stroke-width=".95" stroke-opacity=".96"/>
<circle cx="48" cy="48" r="44.75" fill="none" stroke="#e2fff1" stroke-width=".55" stroke-opacity=".38"/>
</svg>